name: build-zh-cn-translation

on:
  push:
    branches:
      - patch-1
    paths:
      - ".github/workflows/build-zh-cn-translation.yml"
      - "dist/languages/zh_CN.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-translation:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt Linguist compiler
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.8.3
          if (!(Get-Command pyside6-lrelease -ErrorAction SilentlyContinue)) {
            throw "pyside6-lrelease command was not installed"
          }

      - name: Compile Chinese translation only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "output/languages" | Out-Null
          pyside6-lrelease "dist/languages/zh_CN.ts" -qm "output/languages/zh_CN.qm"
          if (!(Test-Path "output/languages/zh_CN.qm")) {
            throw "zh_CN.qm was not generated"
          }
          Get-Item "output/languages/zh_CN.qm" | Format-List Name,Length

      - name: Upload QM translation
        uses: actions/upload-artifact@v4
        with:
          name: lichii-zh-cn-translation
          path: output/languages/zh_CN.qm
          if-no-files-found: error
          retention-days: 14
